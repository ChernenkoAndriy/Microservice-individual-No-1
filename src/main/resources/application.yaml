spring:
  application:
    name: Gym_CRM
    security:
      jwt:
        secret-key: ${JWT_SECRET_KEY}
        expiration: 86400000 # 24 hours
      brute-force:
        max-attempts: 3
        lock-duration-minutes: 5
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: "health,info,metrics,prometheus"
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    prometheus:
      enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: "Gym CRM Application"
    description: "REST API for managing gym trainees, trainers, and training sessions"
    version: "1.0-SNAPSHOT"